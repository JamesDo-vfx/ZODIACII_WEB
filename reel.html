<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
      (() => {
        const { pathname, search, hash } = window.location;
        if (!pathname.endsWith(".html")) return;
        const page = pathname.split("/").pop();
        const params = new URLSearchParams(search);
        const routes = {
          "index.html": "/",
          "about.html": "/about/",
          "contact.html": "/contact/",
          "work.html": params.get("category") && params.get("category") !== "all" ? `/work/${params.get("category")}/` : "/work/",
          "reel.html": params.get("category") ? `/reel/${params.get("category")}/` : "/reel/music-video/",
          "project.html": params.get("slug") ? `/project/${params.get("slug")}/` : "/work/",
          "profile.html": params.get("person") ? `/profile/${params.get("person")}/` : "/about/"
        };
        if (routes[page]) window.location.replace(`${routes[page]}${hash}`);
      })();
    </script>
    <meta name="description" content="Watch cinematic reels by Zodiac II Media.">
    <title>Reel | Zodiac II Media</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
  </head>
  <body data-page="reel">
    <div class="grain" aria-hidden="true"></div>
    <header class="site-header" data-header>
      <a class="brand-mark" href="/" aria-label="Zodiac II Media home">Zodiac II Media</a>
      <div class="nav-timeline" aria-hidden="true">
        <span data-progress-segment></span><span data-progress-segment></span>
        <span data-progress-segment></span><span data-progress-segment></span>
        <span data-progress-segment></span><span data-progress-segment></span>
      </div>
      <nav class="nav-links" aria-label="Primary navigation">
        <button class="nav-link nav-link--wipe" type="button" data-work-trigger>
          <span class="nav-link__mark" aria-hidden="true"></span>
          <span class="nav-link__label">Work</span>
        </button>
        <a class="nav-link nav-link--wipe" href="/about/">
          <span class="nav-link__mark" aria-hidden="true"></span>
          <span class="nav-link__label">About</span>
        </a>
        <a class="nav-link nav-link--wipe" href="/contact/">
          <span class="nav-link__mark" aria-hidden="true"></span>
          <span class="nav-link__label">Contact</span>
        </a>
      </nav>
    </header>

    <main id="page" class="page-shell">
      <article class="reel-page" data-reel-page>
        <a class="reel-back reveal" href="/#featured-reels">Back</a>
        <section class="reel-hero" aria-labelledby="reel-title">
          <p class="reel-hero__label reveal" data-reel-label>Reel</p>
          <h1 class="reel-hero__title reveal" id="reel-title" data-reel-title>Music Video Reel</h1>
          <p class="reel-hero__description reveal" data-reel-description></p>
        </section>

        <section class="reel-player-wrap reveal" aria-label="Reel video player">
          <video class="reel-player" controls playsinline preload="metadata" data-reel-video></video>
          <button class="hero-scroll-cue" type="button" aria-label="Scroll to next section" data-scroll-cue>
            <span class="hero-scroll-cue__text">Scroll</span>
            <span class="hero-scroll-cue__icon" aria-hidden="true">
              <span class="hero-scroll-cue__line"></span>
              <span class="hero-scroll-cue__dot"></span>
            </span>
          </button>
        </section>

        <section class="other-reels reveal" aria-labelledby="other-reels-title">
          <p class="section-kicker" id="other-reels-title">Other Reels</p>
          <nav class="other-reels__links" data-other-reels aria-label="Other reel pages"></nav>
        </section>
      </article>

      <section class="section-pad contact-strip" aria-labelledby="reel-contact-title">
        <p class="section-kicker reveal" id="reel-contact-title">Contact</p>
        <a class="contact-email reveal" href="mailto:contact@zodiacii.com">contact@zodiacii.com</a>
      </section>
    </main>

    <footer class="site-footer">
      <span>Zodiac II Media</span>
      <span>Ho Chi Minh City, Vietnam</span>
      <span>&copy; 2026</span>
      <span data-local-time>Local Time --:--</span>
    </footer>

    <script src="/data/projects.js" defer></script>
    <script src="https://unpkg.com/lenis@1.1.20/dist/lenis.min.js"></script>
    <script src="/script.js" defer></script>
  </body>
</html>
