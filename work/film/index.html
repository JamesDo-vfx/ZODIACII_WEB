<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/svg+xml" href="/assets/icons/zodiacii-logo.svg">
    <link rel="shortcut icon" href="/assets/icons/zodiacii-logo.svg">
    <meta name="description" content="Selected work by Zodiac II Media.">
    <title>All Work | Zodiac II Media</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
  </head>
  <body data-page="work">
    <div class="grain" aria-hidden="true"></div>
    <header class="site-header" data-header>
      <a class="brand-mark" href="/" aria-label="Zodiac II Media home">Zodiac II Media</a>
      <div class="nav-timeline" aria-hidden="true">
        <span data-progress-segment></span><span data-progress-segment></span>
        <span data-progress-segment></span><span data-progress-segment></span>
        <span data-progress-segment></span><span data-progress-segment></span>
      </div>
      <nav class="nav-links" aria-label="Primary navigation">
        <button class="nav-link nav-link--wipe" type="button" data-work-trigger>
          <span class="nav-link__mark" aria-hidden="true"></span>
          <span class="nav-link__label">Work</span>
        </button>
        <a class="nav-link nav-link--wipe" href="/about/">
          <span class="nav-link__mark" aria-hidden="true"></span>
          <span class="nav-link__label">About</span>
        </a>
        <a class="nav-link nav-link--wipe" href="/contact/">
          <span class="nav-link__mark" aria-hidden="true"></span>
          <span class="nav-link__label">Contact</span>
        </a>
      </nav>
    </header>

    <main id="page" class="page-shell">
      <section class="work-category-hero" aria-labelledby="work-hero-project-title">
        <div class="work-category-hero__media" data-category-media aria-hidden="true"></div>
        <button class="work-category-hero__arrow work-category-hero__arrow--prev" type="button" aria-label="Previous project">&lsaquo;</button>
        <button class="work-category-hero__arrow work-category-hero__arrow--next" type="button" aria-label="Next project">&rsaquo;</button>
        <div class="work-category-hero__copy reveal">
          <p class="work-category-hero__kicker" data-hero-category-label>Commercial</p>
          <h1 id="work-hero-project-title" class="work-category-hero__title" data-hero-project-title>Bvlgari</h1>
          <p class="work-category-hero__client" data-hero-project-client>Serpenti Infinito</p>
          <a class="work-hero__reel-link" data-hero-reel-link href="/reel/film/" aria-label="View reel">
            <span class="work-hero__reel-icon" aria-hidden="true">&gt;</span>
            <span class="work-hero__reel-label">View Reel</span>
          </a>
        </div>
        <button class="hero-scroll-cue" type="button" aria-label="Scroll to next section" data-scroll-cue>
          <span class="hero-scroll-cue__text">Scroll</span>
          <span class="hero-scroll-cue__icon" aria-hidden="true">
            <span class="hero-scroll-cue__line"></span>
            <span class="hero-scroll-cue__dot"></span>
          </span>
        </button>
      </section>

      <section class="work-category-intro content-over-hero">
        <p class="reveal" data-category-subtitle></p>
      </section>

      <section class="work-index" aria-labelledby="work-grid-title">
        <div class="project-grid project-grid--editorial" data-project-grid data-mode="category"></div>
      </section>

      <section class="section-pad contact-strip" aria-labelledby="work-contact-title">
        <p class="section-kicker reveal" id="work-contact-title">Contact</p>
        <a class="contact-email reveal" href="mailto:contact@zodiacii.com">contact@zodiacii.com</a>
      </section>
    </main>

    <footer class="site-footer">
      <span>Zodiac II Media</span>
      <span>Ho Chi Minh City, Vietnam</span>
      <span>&copy; 2026</span>
      <span data-local-time>Local Time --:--</span>
    </footer>
    <script src="/data/projects.js" defer></script>
    <script src="https://unpkg.com/lenis@1.1.20/dist/lenis.min.js"></script>
    <script src="/script.js" defer></script>
  </body>
</html>
